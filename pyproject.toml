[project]
name = "obsidian-export"
version = "0.1.3"
description = "Export connected Obsidian notes and assets for one or more root notes."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "pyyaml>=6.0.2",
  "pytest>=8.0",
  "click>=8.1.7",
  "psutil>=7.2.2",
  "rich>=15.0.0",
  "pydantic>=2.13.5",
]

[project.scripts]
obsidian-export = "obsidian_export.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[tool.ruff.format]
# Prefer single quotes over double quotes.
quote-style = "single"

[tool.black]
skip-string-normalization = true

[tool.bumpversion]
current_version = "0.1.3"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = true
ignore_missing_version = false
ignore_missing_files = false
tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = false
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = '''^version\s*=\s*([\'\"\`])({current_version})\1'''
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/obsidian_export/__init__.py"

[tool.git-changelog]
convention = "angular"
in-place = false
output = "changelog.md"
provider = "github"
sections = "fix,feat,refactor,chore,style,build"
template = "angular"

[dependency-groups]
dev = [
    "bump-my-version>=1.5.1",
    "git-changelog>=2.10.0",
    "pre-commit>=4.6.2",
]
